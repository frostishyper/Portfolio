<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <script src="index.js"></script>
    <title>Profile</title>
</head>

    <body>
        <!-- Parent/Root -->
        <div class="MainContainer">
            <!-- Pannel On The Left -->
            <div class="SidePannel">
                <div class="ProfilePicture">
                    <!-- Filler -->
                    <div class="StatusBadge">
                        <span class="Icon">💻</span>
                        <span class="Text">Standing On Business</span>
                    </div>
                </div>
                <div class="Name">
                    <!-- Filler -->
                    <span class="Username">Frostishyper</span>
                    <span class="Nickname">Lee RC</span>
                </div>
                <div class="linksNinfo">
                    <!-- Spacer -->
                    <div class="InfoEntry" id="School">
                        <span class="Entry-Ico">🎓</span>
                        <span class="Entry-text">Technological Institute Of The Philipines Manila</span>
                    </div>
                    <!-- Spacer -->
                    <div class="InfoEntry" id="Location">
                        <span class="Entry-Ico">📍</span>
                        <span class="Entry-text">Manila</span>
                    </div>
                    <!-- Spacer -->
                    <div class="InfoEntry" id="Steam">
                        <span class="Entry-Ico"><img src="./Media/Steam-Ico.ico" alt="Steam"></span>
                        <span class="Entry-text">Frostplays03</span>
                    </div>
                    <!-- Spacer -->
                    <div class="InfoEntry" id="Github">
                        <span class="Entry-Ico"><img src="./Media/Github-Ico.ico" alt="Github"></span>
                        <span class="Entry-text">Frostishyper</span>
                    </div>
                    <!-- Spacer -->
                    <div class="InfoEntry" id="Facebook">
                        <span class="Entry-Ico"><img src="./Media/FB-Ico.ico" alt="Facebook"></span>
                        <span class="Entry-text">Lee RC</span>
                    </div>
                    <!-- Spacer -->
                    <div class="InfoEntry" id="Linkedin">
                        <span class="Entry-Ico"><img src="./Media/Linkedin-Ico.ico" alt="LinkedIn"></span>
                        <span class="Entry-text">Lee RC</span>
                    </div>
                    <!-- Spacer -->
                </div>
            </div>
            <!-- Pannel On The Right -->
            <div class="MainPannel">

            </div>
        </div>

    </body>
</html>
